<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nginx vs FastAPI</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --border: #e2e1dc;
    --grid: #ecebe6;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    /* categorical slots 1-3, fixed per server */
    --s-nginx: #2a78d6;
    --s-fastapi: #eb6834;
    --s-nginx-tuned: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2c;
      --grid: #262624;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --s-nginx: #3987e5;
      --s-fastapi: #d95926;
      --s-nginx-tuned: #199e70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110;
    --surface-1: #1a1a19;
    --border: #2e2e2c;
    --grid: #262624;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --s-nginx: #3987e5;
    --s-fastapi: #d95926;
    --s-nginx-tuned: #199e70;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  .meta { color: var(--text-secondary); margin: 0 0 24px; }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 24px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .tile .label { color: var(--text-secondary); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .note { color: var(--text-muted); font-size: 13px; }

  .card { margin-bottom: 16px; }
  .card h2 { font-size: 17px; margin: 0; }
  .card .hint { color: var(--text-muted); font-size: 13px; margin: 2px 0 16px; }

  .group { margin-bottom: 14px; }
  .group-label { color: var(--text-secondary); font-size: 13px; margin-bottom: 4px; }
  /* right margin keeps room for the value label after the longest bar */
  .track { position: relative; height: 20px; margin: 0 110px 2px 0; border-left: 1px solid var(--border); }
  .bar {
    position: absolute; left: 0; top: 2px; height: 16px;
    border-radius: 0 4px 4px 0; min-width: 2px;
  }
  .bar-value {
    position: absolute; top: 0; height: 20px; line-height: 20px; padding-left: 6px;
    font-size: 12px; color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .track:hover .bar { filter: brightness(1.1); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--text-secondary); font-weight: 500; }
  .err { color: #e34948; font-weight: 600; }

  #tip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.15);
  }
  #tip b { display: block; }
  footer { color: var(--text-muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>nginx vs FastAPI</h1>
  <p class="meta" id="meta"></p>
  <div class="legend" id="legend"></div>
  <div class="tiles" id="tiles"></div>
  <div id="charts"></div>
  <section class="card">
    <h2>All results</h2>
    <p class="hint">Errors = 4xx/5xx responses + connection errors.</p>
    <div class="table-wrap"><table id="table"></table></div>
  </section>
  <footer>Generated by bench/bench.py · load generator: oha in Docker on the same network, on separate CPU cores.</footer>
</main>
<div id="tip"></div>

<script>
const DATA = __DATA__;

const NAMES = { nginx: 'nginx', fastapi: 'FastAPI', 'nginx-tuned': 'nginx-tuned' };
const color = (s) => `var(--s-${s})`;
const get = (server, scenario) => DATA.results.find((r) => r.server === server && r.scenario === scenario);
const fmt = (n, d = 0) => n.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
const kb = (b) => (b >= 1024 ? fmt(b / 1024, 1) + ' KB' : b + ' B');

// header
const c = DATA.config;
const cpus = c.server_cpus || '?';
document.getElementById('meta').textContent =
  `${new Date(DATA.started).toLocaleString()} · ${cpus} CPU per server · ${c.connections} connections · ${c.duration_s}s per URL`;
document.getElementById('legend').innerHTML = DATA.servers
  .map((s) => `<span><i class="swatch" style="background:${color(s)}"></i>${NAMES[s]}</span>`).join('');

// headline tiles
const tiles = [];
const idx = (s) => get(s, 'index');
if (idx('fastapi')) {
  const rps = idx('fastapi').rps;
  tiles.push({ label: 'FastAPI, index.html', value: fmt(rps) + ' req/s', note: `≈ ${fmt(rps * 86400 / 1e6)} million requests a day` });
}
if (idx('nginx') && idx('fastapi')) {
  tiles.push({ label: 'nginx vs FastAPI, index.html', value: fmt(idx('nginx').rps / idx('fastapi').rps, 1) + '× faster', note: `${fmt(idx('nginx').rps)} vs ${fmt(idx('fastapi').rps)} req/s` });
}
const peakMem = (s) => Math.max(...DATA.results.filter((r) => r.server === s).map((r) => r.mem_mib));
if (DATA.servers.includes('nginx') && DATA.servers.includes('fastapi')) {
  tiles.push({ label: 'Memory under load', value: `${fmt(peakMem('nginx'), 1)} vs ${fmt(peakMem('fastapi'), 1)} MiB`, note: 'nginx vs FastAPI, peak' });
}
document.getElementById('tiles').innerHTML = tiles
  .map((t) => `<div class="tile"><div class="label">${t.label}</div><div class="value">${t.value}</div><div class="note">${t.note}</div></div>`).join('');

// grouped horizontal bar charts: one group per URL, one bar per server
function chart(title, hint, groups, unit, digits) {
  const max = Math.max(...groups.flatMap((g) => g.bars.map((b) => b.value))) || 1;
  const body = groups.map((g) => `
    <div class="group">
      <div class="group-label">${g.label}</div>
      ${g.bars.map((b) => `
        <div class="track" data-tip="<b>${NAMES[b.server]} · ${g.label}</b>${fmt(b.value, digits)} ${unit}">
          <div class="bar" style="width:${(b.value / max) * 100}%;background:${color(b.server)}"></div>
          <div class="bar-value" style="left:${(b.value / max) * 100}%">${fmt(b.value, digits)} ${unit}</div>
        </div>`).join('')}
    </div>`).join('');
  return `<section class="card"><h2>${title}</h2><p class="hint">${hint}</p>${body}</section>`;
}

const perUrl = (metric) => DATA.scenarios.map((sc) => ({
  label: sc.label,
  bars: DATA.servers.map((s) => ({ server: s, value: get(s, sc.key)?.[metric] ?? 0 })),
}));

document.getElementById('charts').innerHTML = [
  chart('Requests per second', 'Higher is better', perUrl('rps'), 'req/s', 0),
  chart('p99 latency', 'Lower is better · 99% of requests were faster than this', perUrl('p99_ms'), 'ms', 2),
  chart('Peak memory under load', 'Lower is better', [{ label: 'all URLs', bars: DATA.servers.map((s) => ({ server: s, value: peakMem(s) })) }], 'MiB', 1),
].join('');

// table
document.getElementById('table').innerHTML = `
  <thead><tr><th>server</th><th>URL</th><th>req/s</th><th>p50</th><th>p99</th><th>bytes/resp</th><th>CPU</th><th>memory</th><th>errors</th></tr></thead>
  <tbody>${DATA.results.map((r) => `
    <tr>
      <td><i class="swatch" style="background:${color(r.server)}"></i> ${NAMES[r.server]}</td>
      <td>${DATA.scenarios.find((s) => s.key === r.scenario).label}</td>
      <td>${fmt(r.rps)}</td>
      <td>${fmt(r.p50_ms, 2)} ms</td>
      <td>${fmt(r.p99_ms, 2)} ms</td>
      <td>${kb(r.bytes_per_response)}</td>
      <td>${fmt(r.cpu_percent)}%</td>
      <td>${fmt(r.mem_mib, 1)} MiB</td>
      <td class="${r.errors ? 'err' : ''}">${fmt(r.errors)}</td>
    </tr>`).join('')}
  </tbody>`;

// tooltip
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = e.clientY + 12 + 'px';
});
</script>
</body>
</html>
